services:
  web:
    image: oven/bun:1
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:8080"
    command: sh -c "bun install && bunx vite --host 0.0.0.0 --port 8080"
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
    tty: true
    stdin_open: true

volumes:
  node_modules:
